#cloud-config
hostname: brodansh-odoo
fqdn: brodansh.de.com.eg
manage_etc_hosts: true
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - git
  - ufw
  - fail2ban
  - unattended-upgrades
timezone: Africa/Cairo

users:
  - default

write_files:
  - path: /etc/sysctl.d/99-odoo-docker.conf
    permissions: "0644"
    content: |
      net.ipv4.ip_forward=1
      net.bridge.bridge-nf-call-iptables=0
      net.bridge.bridge-nf-call-ip6tables=0

runcmd:
  - sysctl --system || true
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker ubuntu || true
  - mkdir -p /opt/odoo
  - chown ubuntu:ubuntu /opt/odoo
  - systemctl enable --now docker || service docker start
  - echo "Hetzner CX33 ready. Clone the repo into /opt/odoo and run ./scripts/up.sh" > /etc/motd
